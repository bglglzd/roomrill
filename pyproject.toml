[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "roomrill"
version = "0.1.0"
description = "Durable room-state leases with arbitration and version-guarded simulator commands."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "bglglzd"}]
dependencies = []

[project.scripts]
roomrill = "roomrill.cli:main"

[tool.setuptools]
packages = ["roomrill"]
include-package-data = true

[tool.setuptools.package-data]
roomrill = ["assets/*"]

[tool.ruff]
target-version = "py311"
line-length = 100
