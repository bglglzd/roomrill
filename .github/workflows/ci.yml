name: Check package
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned build and check tools
        run: python -m pip install -r requirements-dev.txt
      - name: Domain, transport and release boundaries (no model server)
        run: python -B -m unittest discover -s tests -v
      - name: Python static checks
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Browser JavaScript syntax
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: node --check roomrill/assets/app.js
      - name: Build packages
        run: python -m build --no-isolation --outdir "${{ runner.temp }}/roomrill-packages"
      - name: Install this wheel without runtime downloads
        run: python -m pip install --no-deps --no-index "${{ runner.temp }}/roomrill-packages/roomrill-0.1.0-py3-none-any.whl"
      - name: Exercise the installed wheel outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          python -I -m roomrill --db roomrill-wheel-demo.sqlite demo
          python -I -m roomrill record roomrill-wheel-recorded.json
          python -I -m roomrill.scenarios --cases "${{ github.workspace }}/examples/scenarios-v1.json" --output roomrill-wheel-scenarios
      - name: Verify tracked source is unchanged
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: roomrill-${{ matrix.os }}-python${{ matrix.python }}
          path: ${{ runner.temp }}/roomrill-packages/*
          if-no-files-found: error
